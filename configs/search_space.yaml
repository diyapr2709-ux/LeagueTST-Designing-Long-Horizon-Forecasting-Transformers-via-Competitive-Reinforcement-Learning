# The nine design choices of the forecaster and their allowed values.
# 4 * 2 * 4 * 4 * 5 * 3 * 4 * 2 * 2 = 30,720 configurations.
# The same grid is defined in code in leaguetst/search/space.py; this file
# is the human-readable copy that the architect prompt will quote.
patch_len: [8, 12, 16, 24]
stride: [half, full]
n_layers: [1, 2, 3, 4]
n_heads: [2, 4, 8, 16]
d_model: [16, 32, 64, 128, 256]
ff_ratio: [1, 2, 4]
dropout: [0.0, 0.1, 0.2, 0.3]
instance_norm: [true, false]
channel_mode: [independent, mixing]
