[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaguetst"
version = "0.1.0"
description = "Long-horizon forecasting transformers designed by competitive reinforcement learning"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["leaguetst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
